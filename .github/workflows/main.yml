name: VCAM Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 clang xz-utils libssl-dev libplist-dev libxml2-dev
          # Build ldid (required by Theos on Linux)
          git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j2
          sudo cp ldid /usr/local/bin/
      - name: Install iOS toolchain
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C $HOME/theos/toolchain/
          test -x $HOME/theos/toolchain/linux/iphone/bin/clang && echo "toolchain OK" || exit 1
      - name: Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.zip -o master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/
          rm -rf master.zip sdks-master
      - name: Build
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1
      - name: Fix control architecture
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          echo "Fixing architecture in $DEB"
          rm -rf /tmp/deb_fix
          dpkg-deb -R "$DEB" /tmp/deb_fix
          sed -i 's/^Architecture: .*/Architecture: iphoneos-arm64e/' /tmp/deb_fix/DEBIAN/control
          rm -f "$DEB"
          dpkg-deb -b -Zgzip /tmp/deb_fix "$DEB"
          echo "----- final control -----"
          dpkg-deb -f "$DEB"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamPro_deb
          path: packages/*.deb
          if-no-files-found: error
